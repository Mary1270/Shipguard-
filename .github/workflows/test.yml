name: Test contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/**"
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run offline test suite
        run: pytest tests/ -v
